<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lux Vault</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #292929;
    }

    header h1 {
      font-size: 30px;
    }

    header p {
      color: #aaa;
      margin-top: 6px;
    }

    .hero {
      padding: 60px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #aaa;
      margin-bottom: 25px;
    }

    .shop-btn {
      display: inline-block;
      padding: 13px 25px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .products {
      padding: 30px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .products h2 {
      margin-bottom: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: #15151c;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 15px;
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product h3 {
      margin-top: 12px;
    }

    .price {
      margin: 8px 0;
      color: #ddd;
    }

    .buy-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 7px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Lux Vault</h1>
    <p>Your Premium Online Store</p>
  </header>

  <section class="hero">
    <h2>Welcome to Lux Vault</h2>
    <p>Discover products you'll love.</p>
    <a href="#products" class="shop-btn">Shop Now</a>
  </section>

  <section class="products" id="products">
    <h2>Featured Products</h2>

    <div class="product-grid">

      <div class="product">
        <img src="https://via.placeholder.com/500x500" alt="Product">
        <h3>Sample Product</h3>
        <p class="price">₹499</p>
        <button class="buy-btn">Buy Now</button>
      </div>

      <div class="product">
        <img src="https://via.placeholder.com/500x500" alt="Product">
        <h3>Premium Product</h3>
        <p class="price">₹999</p>
        <button class="buy-btn">Buy Now</button>
      </div>

    </div>
  </section>

  <footer>
    © 2026 Lux Vault. All rights reserved.
  </footer>

</body>
</html>
